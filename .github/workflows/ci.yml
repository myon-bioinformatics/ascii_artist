name: ci

on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update

jobs:
  resolve-vendor:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 90bc069c33901bd4b5373eb02311026e0acf2e2e
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Save checked-in vendor identities
        run: cp vendor.lock.json .vendor-baseline.lock.json
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          import json
          from pathlib import Path
          for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
              Path(entry['destination']).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Update public vendor files for this run
        id: vendor-update
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py update --manifest vendor.lock.json
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Refresh legacy provenance from the verified lock
        run: python -S scripts/sync_vendor_provenance.py
      - name: Summarize snapshot and checked-in baseline
        if: always()
        shell: bash
        env:
          VENDOR_UPDATE_OUTCOME: ${{ steps.vendor-update.outcome }}
        run: >-
          python -S scripts/sync_vendor_provenance.py
          --summary-baseline .vendor-baseline.lock.json
          --summary-output "$GITHUB_STEP_SUMMARY"
          --update-outcome "$VENDOR_UPDATE_OUTCOME"
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: |
            vendor.lock.json
            vendor/git_inspector.py
            vendor/github_public_resolver.py
            vendor/python_artifact_provenance.py
            vendor/repository_metadata_contract.py
            vendor/repository_metadata_generator.py
            vendor/mcp-toolcall-lab-LICENSE
            vendor/Ironmate-LICENSE
            vendor/git_inspector.provenance.json
            vendor/github_public_resolver.provenance.json
            vendor/python_artifact_provenance.provenance.json
            vendor/repository_metadata_contract.provenance.json
            vendor/repository_metadata_generator.provenance.json
          if-no-files-found: error
          retention-days: 14

  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@76a9e43fe7469d0e3a5728e0521bc5738afad725

  test:
    permissions:
      contents: read
    needs: [changes, resolve-vendor]
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep failure-identity expected-reports aligned with this matrix.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 90bc069c33901bd4b5373eb02311026e0acf2e2e
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        shell: bash
        run: |
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
          python -S scripts/sync_vendor_provenance.py
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Fetch pinned xprobe JUnit importer
        env:
          XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
        run: |
          set -euo pipefail
          mkdir -p build/shared
          rm -f build/shared/xprobe.py
          curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          data = Path("build/shared/xprobe.py.tmp").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if actual != os.environ["XPROBE_BLOB"]:
              raise SystemExit("Importer verification failed")
          PY
          mv build/shared/xprobe.py.tmp build/shared/xprobe.py
      - name: Compile
        run: python -m py_compile ascii_artist.py
      - name: Verify stdlib runtime isolation
        run: python -S -c "import ascii_artist; assert ascii_artist.__name__ == 'ascii_artist'"
      - name: Test with JUnit
        env:
          PYTHONPATH: build/shared
          ASCII_FAILURE_EVIDENCE: build/controlled-failure
        run: |
          mkdir -p build/test-results
          python -m pytest -q --junitxml="build/test-results/pytest-${{ matrix.python-version }}.xml"
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/test-results/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve controlled child evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-failure-py${{ matrix.python-version }}
          path: build/controlled-failure/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py${{ matrix.python-version }}
          path: |
            vendor.lock.json
            vendor/git_inspector.py
            vendor/github_public_resolver.py
            vendor/python_artifact_provenance.py
            vendor/repository_metadata_contract.py
            vendor/repository_metadata_generator.py
            vendor/mcp-toolcall-lab-LICENSE
            vendor/Ironmate-LICENSE
            vendor/git_inspector.provenance.json
            vendor/github_public_resolver.provenance.json
            vendor/python_artifact_provenance.provenance.json
            vendor/repository_metadata_contract.provenance.json
            vendor/repository_metadata_generator.provenance.json
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: [changes, test]
    if: always() && needs.changes.outputs.non_docs_changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.10/pytest-3.10.xml","junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"

  test-locked:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Fetch pinned shared vendor tool
      uses: actions/checkout@v7
      with:
        repository: myon-bioinformatics/myon-bioinformatics
        ref: 90bc069c33901bd4b5373eb02311026e0acf2e2e
        path: .vendor-sync-tools
        persist-credentials: false
    - name: Verify checked-in vendor copies
      run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Recreate locked vendor files from GitHub
      shell: bash
      run: |
        python -S - <<'PY'
        import json
        from pathlib import Path
        for entry in json.loads(Path('vendor.lock.json').read_text(encoding='utf-8'))['files']:
            Path(entry['destination']).unlink()
        PY
        python -S .vendor-sync-tools/vendor_sync.py materialize --manifest vendor.lock.json
        python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
    - name: Refresh legacy provenance from the verified lock
      run: python -S scripts/sync_vendor_provenance.py
    - name: Install test dependencies
      run: python -m pip install -r tests/requirements.txt
    - name: Fetch pinned xprobe JUnit importer
      env:
        XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
        XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
      run: |
        set -euo pipefail
        mkdir -p build/shared
        rm -f build/shared/xprobe.py
        curl -fsSLo build/shared/xprobe.py.tmp "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
        python - <<'PY'
        import hashlib
        import os
        from pathlib import Path
        data = Path("build/shared/xprobe.py.tmp").read_bytes()
        actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
        if actual != os.environ["XPROBE_BLOB"]:
            raise SystemExit("Importer verification failed")
        PY
        mv build/shared/xprobe.py.tmp build/shared/xprobe.py
    - name: Compile
      run: python -m py_compile ascii_artist.py
    - name: Verify stdlib runtime isolation
      run: python -S -c "import ascii_artist; assert ascii_artist.__name__ == 'ascii_artist'"
    - name: Test with JUnit
      env:
        PYTHONPATH: build/shared
        ASCII_FAILURE_EVIDENCE: build/controlled-failure
      run: |
        mkdir -p build/test-results
        python -m pytest -q --junitxml="build/test-results/pytest-${{ matrix.python-version }}.xml"
    - name: Preserve raw JUnit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-junit-py${{ matrix.python-version }}
        path: build/test-results/pytest-${{ matrix.python-version }}.xml
        if-no-files-found: error
        retention-days: 14
    - name: Preserve controlled child evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-controlled-failure-py${{ matrix.python-version }}
        path: build/controlled-failure/
        if-no-files-found: error
        retention-days: 14
    - name: Preserve vendor lock used by this run
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: locked-vendor-lock-py${{ matrix.python-version }}
        path: |
          vendor.lock.json
          vendor/git_inspector.py
          vendor/github_public_resolver.py
          vendor/python_artifact_provenance.py
          vendor/repository_metadata_contract.py
          vendor/repository_metadata_generator.py
          vendor/mcp-toolcall-lab-LICENSE
          vendor/Ironmate-LICENSE
          vendor/git_inspector.provenance.json
          vendor/github_public_resolver.provenance.json
          vendor/python_artifact_provenance.provenance.json
          vendor/repository_metadata_contract.provenance.json
          vendor/repository_metadata_generator.provenance.json
        if-no-files-found: error
        retention-days: 14
    name: Locked baseline
    timeout-minutes: 20
