name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Change detection
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-change-detection.yml@76a9e43fe7469d0e3a5728e0521bc5738afad725

  test:
    needs: changes
    if: needs.changes.outputs.non_docs_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Fetch pinned xprobe JUnit importer
        env:
          XPROBE_COMMIT: 7e7015b2df69ad446b968f6fa49711b5b1dbdd3f
          XPROBE_BLOB: dbc5b7d55005d6288c072a7612584d6170c216f4
        run: |
          set -euo pipefail
          mkdir -p build/shared
          curl -fsSLo build/shared/xprobe.py "https://raw.githubusercontent.com/myon-bioinformatics/xprobe/$XPROBE_COMMIT/xprobe.py"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          data = Path("build/shared/xprobe.py").read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert actual == os.environ["XPROBE_BLOB"], (actual, os.environ["XPROBE_BLOB"])
          PY
      - name: Compile
        run: python -m py_compile ascii_artist.py
      - name: Verify stdlib runtime isolation
        run: python -S -c "import ascii_artist; assert ascii_artist.__name__ == 'ascii_artist'"
      - name: Test with JUnit
        env:
          PYTHONPATH: build/shared
        run: |
          mkdir -p build/test-results
          python -m pytest -q --junitxml="build/test-results/pytest-${{ matrix.python-version }}.xml"
      - name: Build compact failure identity
        if: always()
        env:
          PYTHONPATH: build/shared
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [ ! -f build/shared/xprobe.py ]; then
            mkdir -p build/test-results
            : > "build/test-results/failure-identity-$PYTHON_VERSION.jsonl"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          import xprobe

          version = os.environ["PYTHON_VERSION"]
          source = Path(f"build/test-results/pytest-{version}.xml")
          output = Path(f"build/test-results/failure-identity-{version}.jsonl")
          if not source.exists():
              output.write_text("", encoding="utf-8")
          else:
              report = xprobe.cases_from_junit(
                  source.read_text(encoding="utf-8"),
                  repository="myon-bioinformatics/ascii_artist",
                  commit_sha=None,
                  report_id="pytest-" + version.replace(".", "_"),
              )
              output.write_text(
                  xprobe.corpus_to_json(report["cases"], jsonl=True),
                  encoding="utf-8",
              )
          PY
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: build/test-results/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve compact failure identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failure-identity-py${{ matrix.python-version }}
          path: build/test-results/failure-identity-${{ matrix.python-version }}.jsonl
          if-no-files-found: warn
          retention-days: 14
