name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/brand/**"
      - "scripts/ascii_artist_repository_diagnostics.py"
      - "scripts/capture_pages.py"
      - "ascii_artist.py"
      - "tests/test_capture_pages.py"
      - "vendor/gh_identity.py"
      - "vendor/github_public_resolver.py"
      - "vendor.lock.json"
      - "tests/test_ascii_artist_repository_diagnostics.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/brand/**"
      - "scripts/ascii_artist_repository_diagnostics.py"
      - "scripts/capture_pages.py"
      - "ascii_artist.py"
      - "tests/test_capture_pages.py"
      - "vendor/gh_identity.py"
      - "vendor/github_public_resolver.py"
      - "vendor.lock.json"
      - "tests/test_ascii_artist_repository_diagnostics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Pages checks (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Install browserless test dependencies
        run: uv pip install 'pytest>=9.1.1'
      - name: Test screenshot scenarios
        run: python -m pytest -q tests/test_capture_pages.py
      - name: Run diagnostics tests
        run: python -m unittest tests.test_ascii_artist_repository_diagnostics -v

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out pinned browser-test-kit validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/browser-test-kit
          ref: 3a054c777a98300ee272e4458990b849c32a7ef0
          path: .browser-test-kit
          persist-credentials: false
      - name: Check out pinned shared web-ui assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/web-ui
          ref: 34129d546c39ca961b12e926b944cc1b7f37f5e3
          path: .web-ui
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
          python-version: "3.15"
          activate-environment: true
          enable-cache: false
      - name: Install browser test dependencies
        run: |
          uv pip install 'playwright>=1.64.0'
          python -m playwright install --with-deps --only-shell chromium
      - name: Build Pages tree
        run: |
          mkdir -p _site
          python scripts/ascii_artist_repository_diagnostics.py _site
          cp _site/repository-diagnostics.html _site/index.html
      - name: Assert ASCII output and diagnostics, then capture
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/capture_pages.py --web-ui .web-ui --sha "$EXPECTED_SHA"
      - name: Validate required images and canonical receipt
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -S .browser-test-kit/scripts/check_capture_evidence.py test-results/pages \
            --expect chromium --captures ascii-output.png,repository-diagnostics.png \
            --sha "$EXPECTED_SHA" --canonical test-results/pages/canonical.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preserve all available Pages evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-diagnostics-pages
          path: |
            _site
            test-results/pages
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize screenshot evidence
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### ASCII and diagnostics screenshot evidence: $JOB_STATUS"
            echo "Chromium desktop: content/viewport assertions, two captures, shared PNG/hash/canonical/run validation."
            echo "Firefox/WebKit/mobile unmeasured; no pixel regression baseline."
            echo "Failed/partial receipts do not count as success. Evidence (14 days): $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
