name: pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/repository_metadata_generator.py"
      - "vendor/repository_metadata_generator.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "tests/test_repository_diagnostics.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/repository_metadata_generator.py"
      - "vendor/repository_metadata_generator.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "tests/test_repository_diagnostics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run diagnostics tests
        run: python -m unittest tests.test_repository_diagnostics -v
      - name: Build Pages tree
        run: |
          mkdir -p _site
          python scripts/repository_diagnostics.py _site
          cp _site/repository-diagnostics.html _site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: repository-diagnostics-pages
          path: _site
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
