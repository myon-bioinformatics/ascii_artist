name: pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "scripts/repository_diagnostics.py"
      - "vendor/repository_metadata_contract.py"
      - "vendor/repository_metadata_contract.provenance.json"
      - "vendor/github_public_resolver.py"
      - "vendor/github_public_resolver.provenance.json"
      - "tests/test_repository_diagnostics.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run diagnostics tests
        run: python -m unittest tests.test_repository_diagnostics -v
      - name: Build Pages tree
        run: |
          mkdir -p _site
          python scripts/repository_diagnostics.py _site
          cp _site/repository-diagnostics.html _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: repository-diagnostics-pages
          path: _site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
