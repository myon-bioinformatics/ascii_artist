[project]
name = "ascii-artist-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "PyYAML>=6.0.3",
  # The shared diagnostics page and bundled CSS (web_ui); move the pin with: uv lock --upgrade-package pysaiyanweboo
  "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@e4c25ddba45b05850cfd2c9666638b1617254990",
]

# Vendored/source runtime has no dependencies. uv manages contributor tools only.
[tool.uv]
package = false

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }
