[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-artist-dev"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "PyYAML>=6.0.3",
  # The shared diagnostics page and bundled CSS (pysaiyanweboo); move the pin with: uv lock --upgrade-package pysaiyanweboo
  "pysaiyanweboo @ git+https://github.com/myon-bioinformatics/PySaiyanWeBoo@bbe5c0b0087f40ff3fffd53bec5111c2ba2d747d",
]

# Only Pages capture installs browser tools; default sync keeps them out.
browser = ["playwright>=1.64.0"]

# The installed artifact is one stdlib-only module; dev tools stay in dependency groups.
[tool.uv]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

[project.scripts]
ascii_artist = "ascii_artist:main"

[tool.setuptools]
py-modules = ["ascii_artist"]
